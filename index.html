<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TempoTrainer Pro</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href='data:application/manifest+json,{"name":"TempoTrainer Pro","short_name":"TempoTrainer","start_url":"index.html","display":"standalone","background_color":"%23ffffff","theme_color":"%23000000","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/3061/3061349.png","sizes":"192x192","type":"image/png"}]}'>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        body { font-family: sans-serif; background-color: #f4f6f9; margin: 0; padding: 15px; }
        .container { max-width: 480px; margin: auto; }
        .section { background: white; padding: 15px; border-radius: 15px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        input, select, button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: 1px solid #ccc; font-size: 1rem; }
        #playback-area, #confirm-area, #finish-area { display: none; height: 80vh; flex-direction: column; justify-content: center; align-items: center; }
        .counter { font-size: 5rem; font-weight: 900; }
        #logDisplay { font-size: 0.8rem; height: 100px; overflow-y: auto; border: 1px solid #eee; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div id="setup-area">
        <div class="section">
            <h3>🎯 動作設定</h3>
            <select id="muscleFilter" onchange="filterActions()"></select>
            <select id="actionSelect"></select>
            <input type="text" id="newMuscle" placeholder="新增部位">
            <input type="text" id="newAction" placeholder="新增動作">
            <button onclick="addNewAction()">新增到資料庫</button>
        </div>
        <div class="section">
            <h3>⚙️ 訓練計畫</h3>
            <label>總組數</label><input type="number" id="totalSets" value="3">
            <label>每組次數</label><input type="number" id="repsInput" value="12">
            <button style="background:black; color:white;" onclick="startTraining()">開始訓練</button>
        </div>
        <div class="section">
            <h3>📊 訓練紀錄</h3>
            <div id="logDisplay">無紀錄</div>
            <button onclick="exportExcel()">匯出 Excel</button>
        </div>
    </div>

    <div id="playback-area">
        <div id="setInfo">第 1 組</div>
        <div class="counter" id="mainDisplay">0</div>
        <div id="statusText" style="font-size:1.5rem;">準備中...</div>
    </div>

    <div id="confirm-area">
        <h2 id="confirmTitle">組數完成！</h2>
        <button id="btnNext" style="background:#00ff88; padding:20px;">繼續下一組</button>
        <button id="btnModify" style="background:#ffcc00; padding:20px; margin-top:10px;">修改目標次數</button>
    </div>
</div>

<script>
    // 1. 初始化資料庫
    let db = [{m: "胸肌", a: "上斜啞鈴推舉"}, {m: "肩膊", a: "啞鈴側平舉"}];
    let logs = [];
    let state = { totalSets: 3, currentSet: 1, targetReps: 12, beat: 0, isRunning: false };

    // 2. 初始化選單
    function init() {
        const mFilter = document.getElementById('muscleFilter');
        const muscles = [...new Set(db.map(i => i.m))];
        mFilter.innerHTML = muscles.map(m => `<option value="${m}">${m}</option>`).join('');
        filterActions();
    }

    function filterActions() {
        const m = document.getElementById('muscleFilter').value;
        const sel = document.getElementById('actionSelect');
        sel.innerHTML = db.filter(i => i.m === m).map(i => `<option>${i.a}</option>`).join('');
    }

    function addNewAction() {
        const m = document.getElementById('newMuscle').value;
        const a = document.getElementById('newAction').value;
        if(m && a) { db.push({m, a}); init(); alert('已新增！'); }
    }

    // 3. 訓練邏輯
    function startTraining() {
        state.totalSets = parseInt(document.getElementById('totalSets').value);
        state.targetReps = parseInt(document.getElementById('repsInput').value);
        state.currentSet = 1;
        document.getElementById('setup-area').style.display = 'none';
        runSet();
    }

    function runSet() {
        state.isRunning = true;
        document.getElementById('playback-area').style.display = 'flex';
        document.getElementById('setInfo').innerText = `第 ${state.currentSet} / ${state.totalSets} 組`;
        doBeat(0, 0);
    }

    function doBeat(current, beat) {
        if (!state.isRunning) return;
        const seq = ['PUSH','HOLD','LOWER','LOWER'];
        document.getElementById('statusText').innerText = seq[beat % 4];
        if (beat % 4 === 0 && beat > 0) current++;
        document.getElementById('mainDisplay').innerText = current;

        if (current > state.targetReps) {
            state.isRunning = false;
            logs.push({動作: document.getElementById('actionSelect').value, 組數: state.currentSet, 次數: state.targetReps});
            document.getElementById('logDisplay').innerHTML = logs.map(l => `<div>${l.動作}: 第${l.組數}組 ${l.次數}下</div>`).join('');
            document.getElementById('playback-area').style.display = 'none';
            document.getElementById('confirm-area').style.display = 'flex';
            return;
        }
        setTimeout(() => doBeat(current, beat + 1), 1000);
    }

    // 4. 控制按鈕
    document.getElementById('btnNext').onclick = () => {
        state.currentSet++;
        if (state.currentSet > state.totalSets) {
            alert('訓練全部完成！');
            location.reload();
        } else {
            document.getElementById('confirm-area').style.display = 'none';
            runSet();
        }
    };

    document.getElementById('btnModify').onclick = () => {
        let n = prompt("輸入新的目標次數", state.targetReps);
        if (n) state.targetReps = parseInt(n);
    };

    function exportExcel() {
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(logs), "紀錄");
        XLSX.writeFile(wb, "Workout.xlsx");
    }

    window.onload = init;
</script>
</body>
</html>
