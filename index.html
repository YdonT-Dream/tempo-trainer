<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TempoTrainer Pro</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href='data:application/manifest+json,{"name":"TempoTrainer Pro","short_name":"TempoTrainer","start_url":"./index.html","display":"standalone","background_color":"%23ffffff","theme_color":"%231a1a1a","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/3061/3061349.png","sizes":"192x192","type":"image/png"}]}'>

    <style>
        :root { --primary-dark: #1a1a1a; }
        body { font-family: sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 480px; margin: auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .btn-large { width: 100%; padding: 20px; margin: 10px 0; border-radius: 15px; border: none; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
        #playback-area, #confirm-area { display: none; text-align: center; }
        .counter { font-size: 4rem; font-weight: 900; margin: 20px 0; }
    </style>
</head>
<body>

<div class="container">
    <div id="setup-area">
        <h3>🎯 設定訓練</h3>
        <select id="actionSelect" style="width:100%; padding:10px;"></select>
        <div style="margin: 15px 0;">
            <label>目標次數</label>
            <input type="number" id="repsInput" value="12" style="width:100%; padding:10px;">
        </div>
        <button class="btn-large" style="background:#1a1a1a; color:white;" onclick="startTraining()">開始訓練</button>
    </div>

    <div id="playback-area">
        <div id="statusText">運動中...</div>
        <div class="counter" id="mainDisplay">0</div>
    </div>

    <div id="confirm-area">
        <h3>組數完成！</h3>
        <button class="btn-large" style="background:#00ff88;" onclick="continueSet(true)">保持相同次數</button>
        <button class="btn-large" style="background:#ffcc00;" onclick="showRepModifier()">修改次數</button>
        <div id="modifier-box" style="display:none;">
            <input type="number" id="newReps" value="12" style="padding:10px; width:50px;">
            <button onclick="continueSet(false)">確認並繼續</button>
        </div>
    </div>
</div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let currentTargetReps = 12;
    let completedReps = 0;

    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const cfg = { push: [880, 0.4], hold: [440, 0.15], lower: [220, 0.3] };
        osc.frequency.setValueAtTime(cfg[type][0], audioCtx.currentTime);
        gain.gain.setValueAtTime(cfg[type][1], audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }

    function startTraining() {
        currentTargetReps = parseInt(document.getElementById('repsInput').value);
        document.getElementById('setup-area').style.display = 'none';
        document.getElementById('playback-area').style.display = 'block';
        runSet();
    }

    function runSet() {
        completedReps = 0;
        let beat = 0;
        const seq = ['push', 'hold', 'lower', 'lower']; // 1:1:2 節奏
        
        let interval = setInterval(() => {
            let state = seq[beat % 4];
            playSound(state);
            document.getElementById('statusText').innerText = state.toUpperCase();
            
            if (beat % 4 === 0) {
                completedReps++;
                document.getElementById('mainDisplay').innerText = completedReps;
                if (completedReps > currentTargetReps) {
                    clearInterval(interval);
                    showConfirmArea();
                }
            }
            beat++;
        }, 1000);
    }

    function showConfirmArea() {
        document.getElementById('playback-area').style.display = 'none';
        document.getElementById('confirm-area').style.display = 'block';
    }

    function showRepModifier() { document.getElementById('modifier-box').style.display = 'block'; }

    function continueSet(keep) {
        if (!keep) currentTargetReps = parseInt(document.getElementById('newReps').value);
        document.getElementById('confirm-area').style.display = 'none';
        document.getElementById('playback-area').style.display = 'block';
        runSet();
    }
</script>
</body>
</html>
