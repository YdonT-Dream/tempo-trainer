<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>重量訓練節奏控制器 Pro</title>
    <!-- 其他 Meta 與 Link 設定保持不變 -->
    <style>
        /* ... 保留之前的 CSS ... */
        #btnAbort { 
            background: var(--pulse-red); color: white; border: none; padding: 12px; 
            border-radius: 12px; width: 100%; margin-top: 20px; font-weight: bold; 
            cursor: pointer; display: none; /* 預設隱藏 */
        }
    </style>
</head>
<body>
<div class="container">
    <!-- ... 安裝按鈕與 Header ... -->

    <div id="setup-area">
        <!-- ... 設定區域 ... -->
        <button class="btn-start" onclick="startTraining()">開始訓練</button>
    </div>

    <div id="playback-area" style="text-align:center; display:none;">
        <div id="statusText" style="font-size:1.5rem; font-weight:800;">準備就緒</div>
        <div id="mainDisplay" style="font-size: 5rem; font-weight: 900; margin:10px 0;">0</div>
        <!-- 這個按鈕在設定頁面是隱藏的 -->
        <button id="btnAbort" onclick="abortWorkout()">🛑 中止訓練並返回</button>
    </div>

    <!-- ... 其餘內容 ... -->
</div>

<script>
    // 開始訓練時：隱藏設定區，顯示中止按鈕
    async function startTraining() {
        if(!document.getElementById('actionSelect').value) return alert('請選擇動作');
        
        document.getElementById('setup-area').style.display = 'none';
        document.getElementById('playback-area').style.display = 'block';
        
        // ★ 關鍵：只有這裡才顯示按鈕
        document.getElementById('btnAbort').style.display = 'block';
        
        // 啟動你的計時邏輯...
    }

    // 中止訓練時：恢復設定區，隱藏中止按鈕
    function abortWorkout() {
        if (confirm('確定要中止訓練嗎？')) {
            // 清除計時器...
            
            document.getElementById('playback-area').style.display = 'none';
            document.getElementById('setup-area').style.display = 'block';
            
            // ★ 關鍵：回到設定頁後隱藏按鈕
            document.getElementById('btnAbort').style.display = 'none';
            
            // 保存已完成進度...
        }
    }

    // 訓練完全結束時：同樣要隱藏按鈕
    function endEntireWorkout() {
        // ...
        document.getElementById('btnAbort').style.display = 'none';
        document.getElementById('setup-area').style.display = 'block';
    }
</script>
</body>
</html>
