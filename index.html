<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TempoTrainer Pro</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href='data:application/manifest+json,{"name":"TempoTrainer Pro","short_name":"TempoTrainer","start_url":"./index.html","display":"standalone","background_color":"%23ffffff","theme_color":"%231a1a1a","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/3061/3061349.png","sizes":"192x192","type":"image/png"}]}'>

    <style>
        :root { --primary-dark: #1a1a1a; }
        body { font-family: sans-serif; background-color: #f4f6f9; margin: 0; padding: 10px; }
        .container { max-width: 480px; margin: auto; }
        
        /* 運動與確認介面全螢幕/半螢幕設置 */
        #playback-area, #confirm-area { 
            background: white; border-radius: 20px; padding: 20px; 
            display: none; flex-direction: column; align-items: center; justify-content: center;
        }
        #playback-area { height: 90vh; }
        #confirm-area { height: 50vh; }

        .section { margin-bottom: 15px; padding: 15px; background: white; border-radius: 12px; }
        select, input, button { width: 100%; padding: 15px; margin-top: 8px; border-radius: 10px; border: 1px solid #ccc; font-size: 1.1rem; }
        .btn-start { background: var(--primary-dark); color: white; font-weight: bold; cursor: pointer; }
        .counter { font-size: 6rem; font-weight: 900; margin: 20px 0; }
        .status-text { font-size: 2rem; font-weight: 800; color: #333; }
    </style>
</head>
<body>

<div class="container">
    <div id="setup-area">
        <div class="section">
            <h3>🎯 選擇動作</h3>
            <select id="muscleFilter" onchange="filterTargetMuscles()"></select>
            <select id="actionSelect" style="margin-top:10px;"></select>
        </div>
        <div class="section">
            <h3>⚙️ 模式與目標</h3>
            <select id="trainMode">
                <option value="normal">正常 (1:1:2)</option>
                <option value="eccentric">離心 (1:1:3)</option>
                <option value="pump">充血 (2:2:2)</option>
            </select>
            <input type="number" id="repsInput" value="12" placeholder="目標次數">
            <button class="btn-start" onclick="startTraining()">開始訓練</button>
        </div>
    </div>

    <!-- 運動介面：高度 90vh (近乎全螢幕) -->
    <div id="playback-area">
        <div id="statusText" class="status-text">準備中...</div>
        <div class="counter" id="mainDisplay">0</div>
    </div>

    <!-- 確認介面：高度 50vh (一半螢幕) -->
    <div id="confirm-area">
        <h2 style="margin-top:0;">組數完成！</h2>
        <button style="background:#00ff88; font-size:1.2rem; border:none;" onclick="continueSet(true)">保持次數，開始下一組</button>
        <button style="background:#ddd; font-size:1.2rem; border:none; margin-top:10px;" onclick="showModifier()">修改次數</button>
        <div id="modifier-box" style="display:none; width:100%;">
            <input type="number" id="newReps" value="12">
            <button onclick="continueSet(false)">確認並繼續</button>
        </div>
    </div>
</div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let actionDatabase = [{muscle: "胸肌", name: "上斜啞鈴推舉"}, {muscle: "肩膊", name: "啞鈴側平舉"}];

    // 初始化選單
    function initSelectors() {
        const mFilter = document.getElementById('muscleFilter');
        const muscles = [...new Set(actionDatabase.map(a => a.muscle))];
        mFilter.innerHTML = muscles.map(m => `<option value="${m}">${m}</option>`).join('');
        filterTargetMuscles();
    }

    function filterTargetMuscles() {
        const filter = document.getElementById('muscleFilter').value;
        const select = document.getElementById('actionSelect');
        select.innerHTML = actionDatabase.filter(a => a.muscle === filter)
                                         .map(a => `<option>${a.name}</option>`).join('');
    }

    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const cfg = { push: [880, 0.4], hold: [440, 0.15], lower: [220, 0.3] };
        osc.frequency.setValueAtTime(cfg[type][0], audioCtx.currentTime);
        gain.gain.setValueAtTime(cfg[type][1], audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }

    function startTraining() {
        document.getElementById('setup-area').style.display = 'none';
        document.getElementById('playback-area').style.display = 'flex';
        runSet();
    }

    function runSet() {
        let target = parseInt(document.getElementById('repsInput').value);
        let mode = document.getElementById('trainMode').value;
        const patterns = { normal: ['push', 'hold', 'lower', 'lower'], eccentric: ['push', 'hold', 'lower', 'lower', 'lower'], pump: ['push', 'push', 'hold', 'hold', 'lower', 'lower'] };
        const seq = patterns[mode];
        let completed = 0, beat = 0;
        
        let interval = setInterval(() => {
            let state = seq[beat % seq.length];
            playSound(state);
            document.getElementById('statusText').innerText = state.toUpperCase();
            if (beat % seq.length === 0) {
                completed++;
                document.getElementById('mainDisplay').innerText = completed;
                if (completed > target) {
                    clearInterval(interval);
                    document.getElementById('playback-area').style.display = 'none';
                    document.getElementById('confirm-area').style.display = 'flex';
                }
            }
            beat++;
        }, 1000);
    }

    function showModifier() { document.getElementById('modifier-box').style.display = 'block'; }
    function continueSet(keep) {
        if (!keep) document.getElementById('repsInput').value = document.getElementById('newReps').value;
        document.getElementById('confirm-area').style.display = 'none';
        document.getElementById('playback-area').style.display = 'flex';
        runSet();
    }

    window.onload = initSelectors;
</script>
</body>
</html>
