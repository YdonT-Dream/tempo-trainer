<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TempoTrainer Pro</title>
    <!-- PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href='data:application/manifest+json,{"name":"TempoTrainer Pro","short_name":"TempoTrainer","start_url":"./index.html","display":"standalone","background_color":"%23ffffff","theme_color":"%231a1a1a","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/3061/3061349.png","sizes":"192x192","type":"image/png"}]}'>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        :root { --primary-dark: #1a1a1a; }
        body { font-family: sans-serif; background-color: #f4f6f9; margin: 0; padding: 10px; }
        .container { max-width: 480px; margin: auto; }
        .section { background: white; padding: 15px; border-radius: 15px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        select, input, button { width: 100%; padding: 12px; margin-top: 5px; border-radius: 8px; border: 1px solid #ccc; font-size: 1rem; }
        #playback-area, #confirm-area { display: none; height: 90vh; flex-direction: column; align-items: center; justify-content: center; background: white; border-radius: 20px; }
        .counter { font-size: 5rem; font-weight: 900; }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <div id="setup-area">
        <div class="section">
            <h3>🎯 動作與部位管理</h3>
            <select id="muscleFilter" onchange="filterTargetMuscles()"></select>
            <select id="actionSelect"></select>
            <input type="text" id="newMuscle" placeholder="新增部位">
            <input type="text" id="newAction" placeholder="新增動作">
            <button onclick="addCustomItem()">新增動作</button>
        </div>
        <div class="section">
            <h3>⚙️ 模式與目標</h3>
            <select id="trainMode">
                <option value="normal">正常 (1:1:2)</option>
                <option value="eccentric">離心 (1:1:3)</option>
                <option value="pump">充血 (2:2:2)</option>
            </select>
            <input type="number" id="repsInput" value="12">
            <button class="btn-start" style="background:#1a1a1a; color:white;" onclick="startTraining()">開始訓練</button>
        </div>
        <div class="section">
            <h3>📊 記錄與匯出</h3>
            <div id="logList" style="font-size:0.8rem; height:100px; overflow-y:scroll;"></div>
            <button onclick="exportExcel()">匯出 Excel</button>
        </div>
    </div>

    <div id="playback-area">
        <div id="statusText" style="font-size:1.5rem;">運動中...</div>
        <div class="counter" id="mainDisplay">0</div>
    </div>

    <div id="confirm-area">
        <h3>組數完成！</h3>
        <button style="background:#00ff88; padding:20px; font-size:1.2rem;" onclick="continueSet(true)">保持次數，開始下一組</button>
        <button style="background:#ddd; padding:20px; font-size:1.2rem; margin-top:10px;" onclick="showModifier()">修改次數</button>
        <div id="modifier-box" style="display:none; width:100%;">
            <input type="number" id="newReps" value="12">
            <button onclick="continueSet(false)">確認並繼續</button>
        </div>
    </div>
</div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let db = [{muscle: "胸肌", name: "上斜啞鈴推舉"}, {muscle: "肩膊", name: "啞鈴側平舉"}];
    let workoutLogs = [];

    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const cfg = { push: [880, 0.4], hold: [440, 0.15], lower: [220, 0.3] };
        osc.frequency.setValueAtTime(cfg[type][0], audioCtx.currentTime);
        gain.gain.setValueAtTime(cfg[type][1], audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }

    function filterTargetMuscles() {
        const m = document.getElementById('muscleFilter').value;
        const s = document.getElementById('actionSelect');
        s.innerHTML = db.filter(a => a.muscle === m).map(a => `<option>${a.name}</option>`).join('');
    }

    function addCustomItem() {
        const m = document.getElementById('newMuscle').value;
        const a = document.getElementById('newAction').value;
        if(m && a) {
            db.push({muscle: m, name: a});
            initSelectors();
            alert('已新增');
        }
    }

    function initSelectors() {
        const mFilter = document.getElementById('muscleFilter');
        const muscles = [...new Set(db.map(a => a.muscle))];
        mFilter.innerHTML = muscles.map(m => `<option value="${m}">${m}</option>`).join('');
        filterTargetMuscles();
    }

    function startTraining() {
        document.getElementById('setup-area').style.display = 'none';
        document.getElementById('playback-area').style.display = 'flex';
        runSet();
    }

    function runSet() {
        let target = parseInt(document.getElementById('repsInput').value);
        let mode = document.getElementById('trainMode').value;
        const patterns = { normal: ['push','hold','lower','lower'], eccentric: ['push','hold','lower','lower','lower'], pump: ['push','push','hold','hold','lower','lower'] };
        const seq = patterns[mode];
        let completed = 0, beat = 0;
        
        let interval = setInterval(() => {
            let state = seq[beat % seq.length];
            playSound(state);
            document.getElementById('statusText').innerText = state.toUpperCase();
            if (beat % seq.length === 0) {
                completed++;
                document.getElementById('mainDisplay').innerText = completed;
                if (completed > target) {
                    clearInterval(interval);
                    workoutLogs.push({動作: document.getElementById('actionSelect').value, 次數: target, 時間: new Date().toLocaleTimeString()});
                    document.getElementById('logList').innerHTML += `<div>${document.getElementById('actionSelect').value}: ${target}下</div>`;
                    document.getElementById('playback-area').style.display = 'none';
                    document.getElementById('confirm-area').style.display = 'flex';
                }
            }
            beat++;
        }, 1000);
    }

    function exportExcel() {
        const ws = XLSX.utils.json_to_sheet(workoutLogs);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "記錄");
        XLSX.writeFile(wb, "Workout_Log.xlsx");
    }

    function continueSet(keep) {
        if (!keep) document.getElementById('repsInput').value = document.getElementById('newReps').value;
        document.getElementById('confirm-area').style.display = 'none';
        document.getElementById('playback-area').style.display = 'flex';
        runSet();
    }

    window.onload = initSelectors;
</script>
</body>
</html>
