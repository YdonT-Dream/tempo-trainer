<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>重量訓練節奏控制器 Pro</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="icon" type="image/svg+xml" href="./icon.svg">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root { --bg-color: #f4f6f9; --primary-dark: #1a1a1a; --neon-green: #00ff88; --pulse-red: #ff3366; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); margin: 0; padding: 15px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; background: white; padding: 25px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .app-icon { width: 80px; height: 80px; margin: 0 auto 12px; background: #1a1a1a; border-radius: 20px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .install-btn { background: #2563eb; color: white; border: none; padding: 12px; border-radius: 12px; width: 100%; font-weight: bold; margin-bottom: 20px; display: none; }
        .section { background: #f8f9fa; padding: 18px; border-radius: 16px; margin-bottom: 15px; border: 1px solid #eef0f2; }
        label { font-weight: 600; color: #6c757d; font-size: 0.8rem; text-transform: uppercase; }
        input, select, button { padding: 12px; font-size: 1rem; border: 2px solid #e2e8f0; border-radius: 12px; width: 100%; margin-top: 5px; box-sizing: border-box; }
        .btn-start { background: var(--primary-dark); color: white; font-weight: bold; cursor: pointer; }
        #btnAbort { background: var(--pulse-red); color: white; margin-top: 20px; font-weight: bold; cursor: pointer; }
        .log-item { background: white; padding: 10px; margin: 8px 0; border-left: 4px solid var(--primary-dark); font-size: 0.9rem; }
    </style>
</head>
<body>
<div class="container">
    <button id="installAppBtn" class="install-btn">📲 安裝到手機桌面</button>
    <div class="app-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <text x="256" y="140" fill="#00FF88" font-family="Arial" font-weight="900" font-size="75" text-anchor="middle" letter-spacing="4">TEMPO</text>
            <path d="M120 270 h272" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round"/>
            <path d="M150 174 v192 M90 209 v122" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round"/>
            <path d="M362 174 v192 M422 209 v122" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round"/>
            <path d="M160 410 L210 410 L240 350 L270 450 L300 410 L352 410" fill="none" stroke="#00FF88" stroke-width="24" stroke-linecap="round"/>
        </svg>
    </div>
    <div id="setup-area">
        <div class="section">
            <h3>🎯 選擇動作</h3>
            <select id="muscleFilter" onchange="filterTargetMuscles()"><option value="all">-- 全部部位 --</option></select>
            <select id="actionSelect"></select>
        </div>
        <div class="section">
            <h3>➕ 自訂動作</h3>
            <select id="customMuscleSelect" onchange="toggleCustomMuscleInput()"></select>
            <input type="text" id="customMuscleInput" placeholder="請輸入全新部位名稱" style="display:none;">
            <input type="text" id="customActionName" placeholder="輸入動作名稱">
            <button onclick="addNewCustomAction()">儲存特定動作</button>
        </div>
        <div class="section">
            <h3>⚙️ 設定目標</h3>
            <label>訓練模式</label>
            <select id="trainMode">
                <option value="normal">正常 (1:1:2)</option>
                <option value="eccentric">離心 (1:1:3)</option>
                <option value="pump">充血 (2:2:2:1)</option>
            </select>
            <div style="display:flex; gap:10px;">
                <div style="flex:1"><label>組數</label><input type="number" id="targetSets" value="3"></div>
                <div style="flex:1"><label>次數</label><input type="number" id="targetReps" value="12"></div>
            </div>
            <label>組間休息(秒)</label>
            <input type="number" id="restDuration" value="30">
            <button class="btn-start" onclick="startTraining()">開始訓練</button>
        </div>
    </div>
    <div id="playback-area" style="text-align:center;">
        <div id="statusText" style="font-size:1.5rem; font-weight:800;">準備就緒</div>
        <div id="mainDisplay" style="font-size: 5rem; font-weight: 900; margin:10px 0;">0</div>
        <div id="subStatusText">---</div>
        <button id="btnAbort" onclick="abortWorkout()">🛑 中止訓練並返回</button>
    </div>
    <div class="section" id="exportGroup" style="display:none;">
        <button onclick="exportTodayExcel()">📊 匯出 Excel</button>
        <button onclick="exportTodayLog()" style="margin-top:10px;">📄 匯出 TXT 報告</button>
    </div>
    <div id="logContainer"></div>
</div>

<script>
    // 核心邏輯
    let actionDatabase = [], intervalId = null, currentSet = 1, currentRep = 1, beatCount = 0, prepareSeconds = 5, appState = 'PREPARE', todayWorkoutSession = [];
    
    // PWA & UI Logic
    const installBtn = document.getElementById('installAppBtn');
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); window.deferredPrompt = e; installBtn.style.display = 'block'; });
    installBtn.onclick = () => { if (window.deferredPrompt) { window.deferredPrompt.prompt(); window.deferredPrompt = null; } else { alert('請點選瀏覽器選單「加到主畫面」。'); } };
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');

    window.onload = () => {
        actionDatabase = localStorage.getItem('custom_actions_v2') ? [...[{muscle:"胸肌-上胸", name:"【啞鈴】上斜推舉"}], ...JSON.parse(localStorage.getItem('custom_actions_v2'))] : [{muscle:"胸肌-上胸", name:"【啞鈴】上斜推舉"}];
        updateMuscleFilterOptions(); filterTargetMuscles();
    };

    function updateMuscleFilterOptions() {
        const filterEl = document.getElementById('muscleFilter'), customSelect = document.getElementById('customMuscleSelect');
        const muscles = [...new Set(actionDatabase.map(a => a.muscle))];
        filterEl.innerHTML = '<option value="all">-- 全部部位 --</option>';
        customSelect.innerHTML = '';
        muscles.forEach(m => { filterEl.add(new Option(m, m)); customSelect.add(new Option(m, m)); });
        customSelect.add(new Option('➕ 其他', 'other'));
    }

    function toggleCustomMuscleInput() { document.getElementById('customMuscleInput').style.display = (document.getElementById('customMuscleSelect').value === 'other') ? 'block' : 'none'; }

    function filterTargetMuscles() {
        const val = document.getElementById('muscleFilter').value, sel = document.getElementById('actionSelect');
        sel.innerHTML = '';
        actionDatabase.filter(a => val === 'all' || a.muscle === val).forEach(a => sel.add(new Option(a.name, a.name)));
    }

    function addNewCustomAction() {
        const name = document.getElementById('customActionName').value, mSel = document.getElementById('customMuscleSelect').value, mIn = document.getElementById('customMuscleInput').value;
        const muscle = (mSel === 'other') ? mIn : mSel;
        if (!name || !muscle) return alert('請完整填寫！');
        const newAct = { muscle, name: '【自設】' + name };
        actionDatabase.push(newAct);
        localStorage.setItem('custom_actions_v2', JSON.stringify(actionDatabase.filter(a => a.name.includes('【自設】'))));
        updateMuscleFilterOptions(); filterTargetMuscles(); alert('已儲存！');
    }

    function abortWorkout() {
        if (confirm('確定中止訓練嗎？系統將保存已完成組數。')) {
            if (intervalId) clearInterval(intervalId);
            document.getElementById('setup-area').style.display = 'block';
            document.getElementById('btnAbort').style.display = 'none';
            document.getElementById('statusText').innerText = '訓練已中止';
        }
    }

    function exportTodayLog() {
        const blob = new Blob(['\uFEFF', '重量訓練報告\n\n' + todayWorkoutSession.map(i => i['訓練動作']).join('\n')], { type: "text/plain;charset=utf-8" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = 'Report.txt';
        link.click();
    }
    
    // (startTraining 等其餘計時邏輯請依先前完整版填入)
</script>
</body>
</html>
