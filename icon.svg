<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <!-- 深色圓角底框 -->
    <rect width="512" height="512" rx="110" fill="#1A1A1A"/>
    <!-- 螢光綠 TEMPO 字樣 -->
    <text x="256" y="120" fill="#00FF88" font-family="Arial, sans-serif" font-weight="900" font-size="72" text-anchor="middle" letter-spacing="6">TEMPO</text>
    <!-- 經典啞鈴桿子 -->
